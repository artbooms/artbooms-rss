name: Persist RSS cache

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: persist-rss-cache-${{ github.ref }}
  cancel-in-progress: false

jobs:
  persist:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 1) Sveglia Render
      - name: Wake up Render instance
        run: |
          echo "Ping per riattivare Render..."
          curl -fsSL https://rss.artbooms.com/healthz || true
          sleep 30

      # 2) Scarica la cache fuori dal repository
      - name: Download cache from Render
        run: |
          curl \
            --retry 3 \
            --retry-delay 10 \
            --retry-connrefused \
            --max-time 30 \
            -fsSL \
            https://rss.artbooms.com/cache/download \
            -o "$RUNNER_TEMP/articles_cache.json"

          test -s "$RUNNER_TEMP/articles_cache.json" || {
            echo "Errore: cache scaricata vuota."
            exit 1
          }

      # 3) Mantiene la compatibilità con le strutture già usate
      - name: Fix cache structure if needed
        run: |
          CACHE_FILE="$RUNNER_TEMP/articles_cache.json"

          echo "Controllo struttura cache..."

          if jq -e 'type=="array"' "$CACHE_FILE" >/dev/null; then
            echo "Fix: avvolgo lista in oggetto."

            mv "$CACHE_FILE" "$RUNNER_TEMP/articles_cache.tmp"

            jq \
              '{items: ., cursor: 0, last_scan: null, links_hash: null}' \
              "$RUNNER_TEMP/articles_cache.tmp" \
              > "$CACHE_FILE"

          elif jq -e '.items | type=="array"' "$CACHE_FILE" >/dev/null; then
            echo "Fix: converto items[] in dizionario keyed per URL."

            mv "$CACHE_FILE" "$RUNNER_TEMP/articles_cache.tmp"

            jq '
              .
              | .items = (
                  .items
                  | map(select(type=="object" and .url != null))
                  | map({key: .url, value: .})
                  | from_entries
                )
            ' "$RUNNER_TEMP/articles_cache.tmp" \
              > "$CACHE_FILE"

          else
            echo "Struttura cache OK."
          fi

          jq -e '
            type=="object"
            and (.items | (type=="object" or type=="array"))
            and ((.items | length) > 0)
          ' "$CACHE_FILE" >/dev/null

          if grep -Eq '^(<<<<<<<|=======|>>>>>>>)' "$CACHE_FILE"; then
            echo "Errore: marcatori di conflitto trovati nella cache."
            exit 1
          fi

      # 4) Riparte dall'ultimo main, senza stash, merge o rebase
      - name: Commit & push if changed
        run: |
          git config user.name "rss-bot"
          git config user.email "rss-bot@users.noreply.github.com"

          git fetch origin main
          git reset --hard origin/main

          mkdir -p cache

          cp \
            "$RUNNER_TEMP/articles_cache.json" \
            cache/articles_cache.json

          if git diff --quiet -- cache/articles_cache.json; then
            echo "Nessun cambiamento nella cache."
            exit 0
          fi

          git add cache/articles_cache.json

          git commit \
            -m "Persist cache $(date -u +'%Y-%m-%dT%H:%M:%SZ')"

          git push origin HEAD:main

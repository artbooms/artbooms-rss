name: Persist RSS cache
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  sync-cache:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scarica cache da Render
        run: |
          mkdir -p cache
          curl -fsSL https://artbooms-rss.onrender.com/cache/download -o cache/articles_cache.json || echo "{}" > cache/articles_cache.json
          echo "Ultima sincronizzazione: $(date -u)" > cache/last_sync.txt
          ls -l cache/

      - name: Configura git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Commit & Push aggiornamenti cache
        run: |
          git add cache/articles_cache.json cache/last_sync.txt || true
          git stash push --include-untracked -m "pre-rebase stash" || true
          git pull --rebase --autostash || true
          git stash pop || true
          git diff --quiet && echo "Nessuna modifica da committare." || git commit -am "Aggiorna cache RSS da Render [ci skip]"
          git push || echo "Nessuna modifica da pushare."

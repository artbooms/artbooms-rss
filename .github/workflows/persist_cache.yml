name: Persist RSS cache
on:
  schedule:
    - cron: "*/15 * * * *"   # ogni 15 minuti
  workflow_dispatch:

jobs:
  sync-cache:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Scarica cache da Render
        run: |
          echo "Scarico cache da Render..."
          mkdir -p cache
          curl -fsSL https://artbooms-rss.onrender.com/cache/download -o cache/articles_cache.json || echo "{}" > cache/articles_cache.json
          echo "Ultima sincronizzazione: $(date -u)" > cache/last_sync.txt
          cat cache/last_sync.txt

      - name: Configura git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Commit & Push aggiornamenti cache
        run: |
          git pull --rebase
          git add cache/articles_cache.json cache/last_sync.txt || true
          git diff --quiet && echo "Nessuna modifica, skip commit." || git commit -m "Aggiorna cache RSS da Render [ci skip]"
          git push

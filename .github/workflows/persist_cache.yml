name: Persist RSS Cache

on:
  schedule:
    - cron: "*/30 * * * *" # ogni 30 minuti
  workflow_dispatch: {}

jobs:
  persist:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    env:
      RENDER_CACHE_URL: "https://artbooms-rss.onrender.com/cache/download"
      CACHE_FILE_PATH: cache/articles_cache.json

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scarica cache da Render
        run: |
          mkdir -p "$(dirname "${CACHE_FILE_PATH}")"
          curl -fsSL "${RENDER_CACHE_URL}" -o "${CACHE_FILE_PATH}.tmp"
          python - << 'PY'
import json,os
p=os.environ["CACHE_FILE_PATH"]+".tmp"
with open(p,"r",encoding="utf-8") as f: json.load(f)
print("JSON valido:", p)
PY
          mv "${CACHE_FILE_PATH}.tmp" "${CACHE_FILE_PATH}"

      - name: Configura Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Pull con rebase
        run: git pull --rebase

      - name: Commit se cambiata
        run: |
          if git diff --quiet -- "${CACHE_FILE_PATH}"; then
            echo "Nessun cambiamento."
            exit 0
          fi
          git add "${CACHE_FILE_PATH}"
          git commit -m "Aggiornamento cache RSS [skip ci]"

      - name: Push
        run: git push

name: Persist RSS cache

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  save-cache:
    runs-on: ubuntu-latest

    permissions:
      contents: write  # serve per poter fare push sul repo

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Force add and commit cache
        run: |
          mkdir -p cache
          echo "syncing at $(date)" > cache/last_sync.txt
          git config user.name "artbooms-bot"
          git config user.email "bot@artbooms.com"
          git add -f cache/articles_cache.json || echo "niente cache da aggiungere"
          git add -f cache/last_sync.txt
          git commit -m "Aggiornamento automatico cache RSS" || echo "Nessun cambiamento"
          git push

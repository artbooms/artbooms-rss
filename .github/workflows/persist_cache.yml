name: Persist RSS cache
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  persist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download cache from Render
        run: |
          mkdir -p cache
          curl -fsSL https://artbooms-rss.onrender.com/cache/download -o cache/articles_cache.json
          test -s cache/articles_cache.json || (echo "Cache vuota, skip" && exit 0)
      - name: Commit & push if changed
        run: |
          git config user.name "rss-bot"
          git config user.email "rss-bot@users.noreply.github.com"
          git pull --rebase
          if ! git diff --quiet -- cache/articles_cache.json; then
            git add cache/articles_cache.json
            git commit -m "Persist cache $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            git push
          else
            echo "Nessuna modifica nella cache"
          fi

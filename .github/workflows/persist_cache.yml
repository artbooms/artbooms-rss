name: Persist RSS cache

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: persist-rss-cache-${{ github.ref }}
  cancel-in-progress: false

jobs:
  persist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # 1) Sveglia Render (piano free)
      - name: Wake up Render instance
        run: |
          echo "Ping per riattivare Render..."
          curl -fsSL https://rss.artbooms.com/healthz || true
          sleep 30

      # 2) Scarica la cache dall'istanza online
      - name: Download cache from Render
        run: |
          mkdir -p cache
          curl --retry 3 --retry-delay 10 --retry-connrefused --max-time 30 -fsSL https://rss.artbooms.com/cache/download -o cache/articles_cache.json
          test -s cache/articles_cache.json || (echo "Cache vuota, skip" && exit 0)

      # 3) FIX: se items è una LISTA, avvolgila in {items:{...}} per evitare l'errore .get()
      - name: Fix cache structure if needed
        run: |
          echo "Controllo struttura cache..."
          if jq -e 'type=="array"' cache/articles_cache.json >/dev/null; then
            echo "Fix: avvolgo lista in oggetto {items: [...]}."
            mv cache/articles_cache.json cache/articles_cache.tmp
            jq '{items: ., cursor: 0, last_scan: null, links_hash: null}' cache/articles_cache.tmp > cache/articles_cache.json
          elif jq -e '.items | type=="array"' cache/articles_cache.json >/dev/null; then
            echo "Fix: converto items[] (lista) in dizionario keyed per URL."
            mv cache/articles_cache.json cache/articles_cache.tmp
            jq '.
                | .items = ( .items
                    | map(select(type=="object" and .url != null))
                    | map({key: .url, value: .})
                    | from_entries
                  )
              ' cache/articles_cache.tmp > cache/articles_cache.json
          else
            echo "Struttura cache OK."
          fi

      # 4) Commit & push solo se è cambiata
      - name: Commit & push if changed
        run: |
          git config user.name "rss-bot"
          git config user.email "rss-bot@users.noreply.github.com"

          git fetch origin main
          if ! git diff --quiet -- cache/articles_cache.json; then
            git stash push -- cache/articles_cache.json
            git pull --rebase --autostash
            if ! git stash pop; then
              echo "::error::Conflitto nel ripristino della cache; commit annullato."
              exit 1
            fi
          else
            git pull --rebase --autostash
          fi

          python3 - <<'PY'
          import json, re, subprocess
          from pathlib import Path

          def load_cache(text, label):
              marker = r"(?m)^(?:<<<<<<<(?: .*)?|=======|>>>>>>>(?: .*)?)\s*$"
              if re.search(marker, text):
                  raise SystemExit(f"{label}: marcatori di conflitto Git")
              try:
                  data = json.loads(text)
              except json.JSONDecodeError as exc:
                  raise SystemExit(f"{label}: JSON non valido: {exc}")
              if not isinstance(data, dict) or not isinstance(data.get("items"), dict):
                  raise SystemExit(f"{label}: struttura items non valida")

              urls = []
              for key, item in data["items"].items():
                  if not isinstance(item, dict) or item.get("url") != key:
                      raise SystemExit(f"{label}: chiave/URL non coerente: {key}")
                  urls.append(key)
              if len(urls) != len(set(urls)):
                  raise SystemExit(f"{label}: URL duplicati")
              return urls

          path = Path("cache/articles_cache.json")
          previous = load_cache(subprocess.check_output(
              ["git", "show", "origin/main:cache/articles_cache.json"],
              encoding="utf-8",
          ), "cache precedente")
          candidate = load_cache(
              path.read_text(encoding="utf-8"),
              "cache candidata",
          )

          if len(candidate) < len(previous):
              raise SystemExit("cache candidata: numero articoli diminuito")
          previous_set, candidate_set = set(previous), set(candidate)
          missing = [url for url in previous if url not in candidate_set]
          if missing:
              raise SystemExit(
                  f"cache candidata: URL precedente mancante: {missing[0]}"
              )
          if [url for url in candidate if url in previous_set] != previous:
              raise SystemExit(
                  "cache candidata: ordine degli URL esistenti modificato"
              )
          print(
              f"Cache valida: {len(previous)} precedenti, "
              f"{len(candidate) - len(previous)} nuovi."
          )
          PY

          if ! git diff --quiet -- cache/articles_cache.json; then
            git add cache/articles_cache.json
            git commit -m "Persist cache $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            git push origin main
          else
            echo "Nessun cambiamento nella cache"
          fi

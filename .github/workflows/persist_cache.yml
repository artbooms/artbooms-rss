name: Persist RSS cache

on:
  schedule:
    - cron: "*/15 * * * *" # ogni 15 minuti
  workflow_dispatch:

jobs:
  persist-cache:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download cache from Render
        run: |
          mkdir -p cache
          curl -s -o cache/articles_cache.json https://artbooms-rss.onrender.com/cache/download

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase
          git add cache/articles_cache.json
          git commit -m "[Persist Cache] Updated cache/articles_cache.json" || echo "No changes to commit"
          git push origin main

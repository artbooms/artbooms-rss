name: Persist RSS cache

on:
  schedule:
    - cron: "*/15 * * * *"   # ogni 15 minuti
  workflow_dispatch: {}

jobs:
  persist:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    env:
      RENDER_CACHE_URL: ${{ secrets.RENDER_CACHE_URL }}
      CACHE_FILE_PATH: cache/articles_cache.json

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scarica cache da Render
        run: |
          mkdir -p "$(dirname "${CACHE_FILE_PATH}")"
          if [ -z "${RENDER_CACHE_URL}" ]; then
            echo "RENDER_CACHE_URL non configurato. Esco senza errore."
            exit 0
          fi
          echo "Scarico ${RENDER_CACHE_URL} -> ${CACHE_FILE_PATH}"
          curl -fsSL "${RENDER_CACHE_URL}" -o "${CACHE_FILE_PATH}.tmp"
          python - << 'PY'
import json, os
p=os.environ["CACHE_FILE_PATH"]+".tmp"
with open(p,"r",encoding="utf-8") as f: json.load(f)
print("JSON valido:", p)
PY
          mv "${CACHE_FILE_PATH}.tmp" "${CACHE_FILE_PATH}"

      - name: Configura Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Pull con rebase
        run: git pull --rebase

      - name: Commit solo se cambia
        run: |
          if git diff --quiet -- "${CACHE_FILE_PATH}"; then
            echo "Nessun cambiamento nella cache."
            exit 0
          fi
          git add "${CACHE_FILE_PATH}"
          git commit -m "chore(cache): update articles_cache.json [skip ci]"

      - name: Push
        run: git push

name: Verify editorial signals
on:
  pull_request:
    paths:
      - article_parser.py
      - news_sitemap.py
      - scripts/audit_editorial_signals.py
      - tests/**
      - .github/workflows/verify-editorial-signals.yml
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13.4'
      - name: Install pinned XML dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libxml2-dev libxslt1-dev
          python -m pip install -r requirements.txt -r requirements-test.txt
          python -m pip check
      - name: Run offline regression and native Linux integration tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v

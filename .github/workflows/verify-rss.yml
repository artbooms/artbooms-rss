name: Verify RSS on Linux
on:
  push:
    branches:
      - codex/verifica-rss-2026-10-06
      - codex/websub-arte-2026-10-15
      - codex/skip-render-cache-2026-10-15
      - codex/websub-preflight-2026-10-16
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            python: '3.12.15'
          - os: ubuntu-26.04
            python: '3.12.15'
          # Exact production patch; setup-python has no 26.04 build for it.
          - os: ubuntu-24.04
            python: '3.13.4'
          - os: ubuntu-26.04
            python: '3.13.16'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install native XML build prerequisites
        if: matrix.python != '3.12.15'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libxml2-dev libxslt1-dev
      - name: Build pinned lxml with release XML versions on Ubuntu 26.04
        if: matrix.os == 'ubuntu-26.04' && matrix.python != '3.12.15'
        env:
          STATIC_DEPS: 'true'
          LIBXML2_VERSION: '2.12.6'
          LIBXSLT_VERSION: '1.1.39'
          ZLIB_VERSION: '1.3.2'
          LIBICONV_VERSION: '1.19'
          MULTICORE: '2'
          CFLAGS: '-O2 -fPIC'
          LDFLAGS: '-fPIC'
        run: python -m pip install --no-cache-dir --no-binary=lxml lxml==5.2.2
      - name: Install project and test dependencies
        id: dependencies
        run: |
          python -m pip install -r requirements.txt -r requirements-test.txt
          python -m pip check
      - name: Run unchanged baseline tests
        shell: bash
        run: |
          set -o pipefail
          git worktree add --detach "$RUNNER_TEMP/rss-baseline" 10d82424d45304c83feb7f4a40f8ae49467d31ec
          cd "$RUNNER_TEMP/rss-baseline"
          python -m unittest discover -s tests -p 'test_*.py' -v 2>&1 | tee "$GITHUB_WORKSPACE/linux-baseline-results.txt"
      - name: Run offline regression and integration tests
        if: always() && steps.dependencies.outcome == 'success'
        shell: bash
        run: |
          set -o pipefail
          python -m unittest discover -s tests -p 'test_*.py' -v 2>&1 | tee linux-test-results.txt
      - name: Record installed versions
        if: always()
        run: |
          python -VV > linux-python-runtime.txt
          python -m pip freeze > linux-python-versions.txt
      - name: Record native library versions
        if: always() && steps.dependencies.outcome == 'success'
        run: |
          python -c "import json, lxml.etree as e, yaml; print(json.dumps({'lxml': e.LXML_VERSION, 'libxml_runtime': e.LIBXML_VERSION, 'libxml_compiled': e.LIBXML_COMPILED_VERSION, 'libxslt_runtime': e.LIBXSLT_VERSION, 'libxslt_compiled': e.LIBXSLT_COMPILED_VERSION, 'pyyaml_with_libyaml': yaml.__with_libyaml__}))" > linux-native-libraries.json
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: rss-verifica-${{ matrix.os }}-python-${{ matrix.python }}
          path: |
            linux-test-results.txt
            linux-baseline-results.txt
            linux-python-versions.txt
            linux-python-runtime.txt
            linux-native-libraries.json

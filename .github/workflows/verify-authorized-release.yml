name: Verify authorized RSS release
on:
  push:
    branches:
      - codex/fresh-discovery-2026-11-22
      - codex/crawler-observability-2026-11-22
permissions:
  contents: read
jobs:
  production-python:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13.4'
      - name: Install native XML prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libxml2-dev libxslt1-dev
      - name: Install pinned dependencies
        run: |
          python -m pip install -r requirements.txt -r requirements-test.txt
          python -m pip check
      - name: Run full isolated test suite
        env:
          POPULATOR_ENABLED: '0'
          CACHE_BOOTSTRAP_REMOTE: '0'
        run: python -m unittest discover -s tests -p 'test_*.py' -v
